name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it makes obsolete:
# billed minutes (macOS counts 10x) go to the last commit only. main and
# tags each keep every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs, research notes, the Python RE tools, the Pages site and C++ comments don't touch
  # the build: a change to only those skips build, tidy and flatpak (tools.yml tests the
  # Python). tests/*.py drive the d2d binary and tidy-pr-select.py picks
  # tidy's files, so those still build; a tag always does.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Anything that builds?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] || ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(grep -vE '^docs/|\.md$|^tools/[^/]+\.py$|^tools/(emu|ghidra|site)/|^\.github/workflows/(cache-cleanup|coverity|gaps|guard|tools)\.yml$' <<<"$files" || true)
          # A comment-only edit to engine or app C++ doesn't build either:
          # compare each side with comments and whitespace stripped. Not
          # tests/: their // test-links: comments are CMake's.
          base=$(git merge-base "$BASE" "$HEAD")
          stripped() { git show "$1:$2" | gcc -fpreprocessed -dD -E -P -x c++ - 2>/dev/null | tr -d ' \t\n'; }
          for file in $code; do
            if [[ "$file" =~ ^(components|apps)/.*\.(c|cc|cpp|h|hpp)$ ]] && old=$(stripped "$base" "$file") \
                && [[ -n "$old" && "$old" == "$(stripped "$HEAD" "$file" || true)" ]]; then
              code=$(grep -vxF "$file" <<<"$code" || true)
            fi
          done
          if [[ -n "$code" ]] || grep -qx 'tools/tidy-pr-select.py' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Hash relative paths so ccache hits survive a moved workspace
      # (as ../opendf).
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: "locale,time_macros,include_file_ctime,include_file_mtime"
      # Prebuilt Windows dependency versions (see "Download prebuilt dependencies").
      SDL3_VERSION: "3.4.16"
      OPENAL_VERSION: "1.25.2"
      # BtbN keeps month-end autobuilds indefinitely (dailies are pruned), so
      # pin one of those: an immutable n9.0.x release-branch build.
      FFMPEG_TAG: "autobuild-2026-08-31-13-27"
      FFMPEG_BUILD: "ffmpeg-n9.0.1-11-ge47273f4d9-${{ matrix.arch == 'arm64' && 'winarm64' || 'win64' }}-lgpl-shared-9.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # libsdl3-dev is only in 25.04+; ubuntu-latest (24.04) lacks it.
          - os: ubuntu-26.04
            name: Linux (GCC)
          - os: macos-latest
            name: macOS (Clang)
          # Intel Macs. macOS 15's Homebrew bottles: the .dmg needs 15 or later.
          - os: macos-15-intel
            name: macOS Intel (Clang)
            artifact_suffix: -Intel
          - os: windows-latest
            name: Windows (MSVC)
            arch: x64
          # Native ARM64 (docs/design/platform-support.md), not x64 emulated:
          # "Check the package's architecture" fails a binary of any other kind.
          - os: windows-11-arm
            name: Windows ARM64 (MSVC)
            arch: arm64
            artifact_suffix: -ARM64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0   # every tag, for git describe's version stamp

      # The .debs come from the Actions cache, not the Azure mirror: it once
      # took 35 min for these 82 MB (2026-10-22). Refreshed weekly; apt
      # fetches only what changed since.
      - name: Week for the apt cache key (Linux)
        if: runner.os == 'Linux'
        id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-${{ steps.apt-week.outputs.week }}
          restore-keys: apt-${{ matrix.os }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          apt_opts=(-o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true
                    -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo rm -f /var/lib/man-db/auto-update   # skip the man-db trigger
          sudo apt-get "${apt_opts[@]}" update -qq
          sudo apt-get "${apt_opts[@]}" install -y cmake ninja-build build-essential pkg-config libcurl4-openssl-dev \
            libsdl3-dev libopenal-dev zlib1g-dev libbz2-dev libstorm-dev qt6-base-dev libgl1-mesa-dev \
            clang-tidy
          sudo apt-get "${apt_opts[@]}" autoclean -qq   # drop superseded versions from the cache
          sudo chown -R "$USER" ~/apt-archives          # so the cache step can read them

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl3 openal-soft qtbase stormlib

      # FFmpeg: Linux and macOS build a Bink-only one (apps/d2d/CMakeLists.txt).
      # Windows: prebuilt release binaries rather than compiling anything.
      #   SDL3        - libsdl-org's VC dev zip (ships SDL3Config.cmake)
      #   OpenAL Soft - kcat's bin zip (headers, OpenAL32.lib, soft_oal.dll);
      #                 it has no ARM64 build, so arm64 takes vcpkg's
      #   FFmpeg      - BtbN's LGPL shared build (import libs + .pc files),
      #                 a pinned month-end autobuild of the 9.0 release branch
      #   zlib,       - no official MSVC binaries; the runner's preinstalled
      #   StormLib      vcpkg builds them (and bzip2), cached with the rest.
      # Bump the versions here and the cache key together.
      - name: Cache Windows dependencies
        if: runner.os == 'Windows'
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps
          key: deps-win-${{ matrix.arch }}-sdl3-${{ env.SDL3_VERSION }}-openal-${{ env.OPENAL_VERSION }}-${{ env.FFMPEG_BUILD }}-zlib-stormlib-v2

      - name: Download prebuilt dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          function Get-Zip($url, $name) {
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\$name.zip"
            7z x -y "-o$deps" "$env:RUNNER_TEMP\$name.zip" | Out-Null
          }
          Get-Zip "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL3_VERSION/SDL3-devel-$env:SDL3_VERSION-VC.zip" sdl3
          Get-Zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_TAG/$env:FFMPEG_BUILD.zip" ffmpeg
          $ports = @("zlib", "stormlib")
          if ("${{ matrix.arch }}" -eq "arm64") { $ports += "openal-soft" }
          else { Get-Zip "https://github.com/kcat/openal-soft/releases/download/$env:OPENAL_VERSION/openal-soft-$env:OPENAL_VERSION-bin.zip" openal }
          # tools/vcpkg-ports: openal-soft 1.25.2 with upstream's fix for MSVC 14.52
          # (tools/vcpkg-ports/README.md); without it the arm64 build stops in alc.cpp.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install @ports --triplet ${{ matrix.arch }}-windows --x-install-root="$deps\vcpkg" --overlay-ports="${{ github.workspace }}\tools\vcpkg-ports"
          Get-ChildItem $deps

      # pkg-config for FFmpeg's .pc files (pkgconfiglite is a prebuilt binary).
      # choco exits 0 when its feed is down ("installed 0/0 packages",
      # 2026-10-19), so retry and check pkg-config runs: a failure shows here,
      # not as configure's "Could NOT find PkgConfig".
      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The image's Strawberry Perl already has a pkg-config on PATH (it
          # says 0.26) that CMake's FindPkgConfig doesn't take: with the feed
          # down (504, 2026-11-13) it passed for pkgconfiglite, so it doesn't count.
          function Test-PkgConfig { (Get-Command pkg-config -ErrorAction SilentlyContinue) -and ((pkg-config --version) -ne '0.26') }
          foreach ($try in 1..3) {
            choco install pkgconfiglite -y --no-progress
            if (Test-PkgConfig) { break }
            Write-Host "pkg-config not installed (try $try of 3)"
            Start-Sleep -Seconds (20 * $try)
          }
          if (-not (Test-PkgConfig)) { throw "pkg-config is missing: the Chocolatey install failed 3 times" }
          pkg-config --version

      - name: Set up Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        # v4.3.1: v4.4's `uses: $/action` fails the runner's template check.
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.*'
          host: ${{ matrix.arch == 'arm64' && 'windows_arm64' || 'windows' }}
          target: 'desktop'
          arch: ${{ matrix.arch == 'arm64' && 'win64_msvc2022_arm64' || 'win64_msvc2022_64' }}
          cache: true

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # ccache 4.x handles MSVC too; CMake picks it up via
      # CMAKE_*_COMPILER_LAUNCHER. StormLib and CLI11 (FetchContent) share it.
      # MSVC's /Z7 objects carry their debug info: Windows gets 2 GB.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}
          max-size: ${{ runner.os == 'Windows' && '2G' || '1G' }}
          # Only main saves: each branch run's ~1 GB copy pushed the repo past
          # GitHub's 10 GB and evicted main's, so builds started cold. PRs
          # restore main's.
          save: ${{ github.ref == 'refs/heads/main' }}
          verbose: 2          # the stats list why a call wasn't cacheable

      # The Bink-only FFmpeg (apps/d2d/CMakeLists.txt): CMake skips building
      # it when build/ffmpeg-<version and options> is already there.
      # Keyed on FFmpeg's version and configure options only (the lines that
      # name build/ffmpeg-<key>), so other edits to that CMakeLists keep the
      # cache and a run doesn't fetch ffmpeg.org, which resets connections.
      - name: FFmpeg cache key
        if: runner.os != 'Windows'
        id: ffmpeg-key
        shell: bash
        run: |
          key=$(sed -n -e '/^set(D2D_FFMPEG_VERSION /p' -e '/set(ffmpeg_options/,/enable-decoder=/p' \
            apps/d2d/CMakeLists.txt | git hash-object --stdin)
          echo "key=${key:0:16}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-*
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-key.outputs.key }}
          restore-keys: ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      # Sentry Native and Crashpad are built through FetchContent. Keep their
      # isolated source/build trees so unchanged vendor code needn't compile,
      # and Ninja's log and deps beside them: without those Ninja takes every
      # restored object for stale and compiles all ~265 again. The runner
      # image's version stays out of the key: GitHub rolls a new image out
      # over days, so two runs get two images and miss each other's cache.
      # ponytail: an image whose system headers are newer than the cache
      # rebuilds Sentry every run; delete the sentry-* cache if that shows.
      - name: Sentry cache key
        id: sentry-key
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            compiler_version=$(cl 2>&1 | head -n 1 || true)
          else
            compiler_version="$(cc --version | head -n 1) / $(c++ --version | head -n 1)"
          fi
          key=$({
            sed -n -e '/^    set(SENTRY_BACKEND /,/^    set(SENTRY_SCREENSHOT /p' \
              -e '/^    FetchContent_Declare(/,/^    )/p' apps/d2d/CMakeLists.txt
            printf '%s\n' "$compiler_version" ninja-state
          } | git hash-object --stdin)
          echo "key=${key:0:16}" >> "$GITHUB_OUTPUT"

      - name: Cache Sentry (all platforms)
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/sentry_native-*
            build/.ninja_log
            build/.ninja_deps
          key: sentry-${{ runner.os }}-${{ runner.arch }}-${{ steps.sentry-key.outputs.key }}

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS+=("-DCMAKE_PREFIX_PATH=$(brew --prefix qtbase)")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${EXTRA_ARGS[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\deps"
          $sdl = "$deps\SDL3-$env:SDL3_VERSION"
          $ff = "$deps\$env:FFMPEG_BUILD"
          $z = "$deps\vcpkg\${{ matrix.arch }}-windows"
          $al_include, $al_library = "$deps\openal-soft-$env:OPENAL_VERSION-bin\include", "$deps\openal-soft-$env:OPENAL_VERSION-bin\libs\Win64\OpenAL32.lib"
          if ("${{ matrix.arch }}" -eq "arm64") { $al_include, $al_library = "$z\include", "$z\lib\OpenAL32.lib" }
          $env:PKG_CONFIG_PATH = "$ff\lib\pkgconfig"
          # BtbN's .pc files are relocatable (prefix=${pcfiledir}/../..).
          # Embedded (/Z7), not RelWithDebInfo's /Zi: ccache can't cache a
          # compile that writes a shared .pdb ("Unsupported compiler option",
          # every call). The linker still writes the .pdb Sentry gets. The
          # policy default reaches Sentry/Crashpad's older-minimum CMake too.
          # The header check (cmake/HeaderCheck.cmake) runs on Linux and macOS;
          # here it was ~4 of the build's 14 minutes.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DD2D_CHECK_HEADERS=OFF `
            "-DCMAKE_PREFIX_PATH=$sdl\cmake;$z" `
            "-DSDL3_DIR=$sdl\cmake" `
            "-DOPENAL_INCLUDE_DIR=$al_include" `
            "-DOPENAL_LIBRARY=$al_library"

      - name: Build
        # -k 0: keep going past the first failure so one run shows every error.
        run: cmake --build build --config RelWithDebInfo -- -k 0

      # No game data on the runners: tests that need MPQs print SKIP and pass.
      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo

      # Put every runtime DLL next to the binaries: the tests need them on
      # PATH, and the uploaded artifact then runs as-is.
      - name: Stage runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = "${{ github.workspace }}\deps"
          $dlls = @(
            "$deps\SDL3-$env:SDL3_VERSION\lib\${{ matrix.arch }}\SDL3.dll",
            "$deps\$env:FFMPEG_BUILD\bin\*.dll",
            "$deps\vcpkg\${{ matrix.arch }}-windows\bin\*.dll")   # arm64's OpenAL32.dll too
          if ("${{ matrix.arch }}" -ne "arm64") { $dlls += "$deps\openal-soft-$env:OPENAL_VERSION-bin\bin\Win64\soft_oal.dll" }
          foreach ($dir in @("build\apps\d2d", "build\apps\launcher", "build\tests")) {
            if (Test-Path $dir) { Copy-Item -Path $dlls -Destination $dir -Force }
          }
          # soft_oal.dll is what OpenAL32.lib imports as OpenAL32.dll.
          Get-ChildItem -Recurse build -Filter soft_oal.dll | ForEach-Object { Copy-Item $_.FullName (Join-Path $_.DirectoryName "OpenAL32.dll") -Force }
          windeployqt --no-translations --no-compiler-runtime build\apps\launcher\d2d-launcher.exe

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo

      # The shipping package (apps/CMakeLists.txt): launcher + d2d + every
      # library they need; a .dmg, .tar.gz or .zip. Built on every run so a
      # PR can't break it. Not `cpack`: on the Windows runner that's
      # Chocolatey's.
      - name: Package
        run: cmake --build build --target package

      # The package as a player gets it: dumpbin's machine for every .exe and
      # .dll in it (8664 x64, AA64 ARM64) and the processor in its name, so
      # an x64 DLL in the ARM64 zip, or the reverse, fails here. The tests
      # above ran on the native runner, not under x64 emulation.
      - name: Check the package's architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $machine, $processor = if ("${{ matrix.arch }}" -eq "arm64") { "AA64", "ARM64" } else { "8664", "AMD64" }
          $zip = Get-Item build\d2d-*.zip
          if ($zip.Name -notlike "*-Windows-$processor.zip") { throw "$($zip.Name) isn't named for $processor" }
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP\package" -Force
          # Microsoft's own redist for this architecture passes as it is: its
          # arm64 folder has a vcruntime140_1.dll that isn't AA64 (run
          # 43476586761), which CMake's InstallRequiredSystemLibraries ships.
          $arch = "${{ matrix.arch }}"
          $redist = if ($env:VCToolsRedistDir) { Get-ChildItem (Join-Path $env:VCToolsRedistDir $arch) -Recurse -Filter *.dll } else { @() }
          $wrong = Get-ChildItem "$env:RUNNER_TEMP\package" -Recurse -Include *.exe, *.dll |
            Where-Object { -not ((dumpbin /headers $_.FullName) -match "^\s*$machine machine") } |
            Where-Object {
              $file = $_
              $hash = (Get-FileHash $file.FullName).Hash
              $theirs = $redist | Where-Object { $_.Name -eq $file.Name -and (Get-FileHash $_.FullName).Hash -eq $hash }
              if ($theirs) {
                $header = (dumpbin /headers $file.FullName) -match 'machine \(' | Select-Object -First 1
                Write-Host "$($file.Name): from Microsoft's $arch redist, not $machine`: $header"
              }
              -not $theirs
            }
          $wrong | ForEach-Object { Write-Host "::error::not $machine`: $($_.FullName)" }
          if ($wrong) { exit 1 }
          Write-Host "$($zip.Name): every binary is $machine, or Microsoft's redist as shipped"

      - name: Upload Sentry debug information
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mindwerks
          SENTRY_PROJECT: d2d
        shell: bash
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN is not configured; native crash reports will lack symbolicated stack traces."
            exit 0
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            dsymutil build/apps/d2d/d2d -o build/d2d.dSYM
            dsymutil build/_deps/sentry_native-build/crashpad_build/handler/crashpad_handler \
              -o build/crashpad_handler.dSYM
            npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources \
              --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
              build/apps/d2d/d2d build/d2d.dSYM \
              build/_deps/sentry_native-build/crashpad_build/handler/crashpad_handler \
              build/crashpad_handler.dSYM
          else
            npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources \
              --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
              build/apps/d2d/d2d \
              build/_deps/sentry_native-build/crashpad_build/handler/crashpad_handler
          fi

      - name: Upload Sentry debug information (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mindwerks
          SENTRY_PROJECT: d2d
        shell: pwsh
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN) {
            Write-Host "::notice::SENTRY_AUTH_TOKEN is not configured; native crash reports will lack symbolicated stack traces."
            exit 0
          }
          npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources `
            --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT `
            build/apps/d2d `
            build/_deps/sentry_native-build/crashpad_build/handler

      # One artifact per OS: the package (the dev tools are in it, beside
      # d2d). Only for main and tags (pull requests build it, but uploading
      # would only fill the artifact quota): main's kept 14 days, a tag's 90.
      # A full quota (it resets every 6-12 h) doesn't fail a run whose build,
      # tidy and tests passed; those are earlier steps and fail the job
      # themselves.
      - name: Upload package
        if: github.event_name == 'push'
        # Keep main builds green if artifact storage is temporarily full, but
        # don't publish a tag release unless every platform package uploaded.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: d2d-${{ runner.os }}${{ matrix.artifact_suffix }}
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}
          path: |
            build/d2d-*.dmg
            build/d2d-*.tar.gz
            build/d2d-*.zip
          if-no-files-found: error

  # clang-tidy reads compile_commands.json, not objects: it runs beside the
  # build instead of after it (4-7 min off a full sweep). Only FFmpeg's
  # headers (cached) and the launcher's main.moc need building first.
  tidy:
    name: Names and includes
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # The build job's cache and package list: a shorter list saved under
      # the same key would leave the build job downloading the rest.
      - name: Week for the apt cache key
        id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-26.04-${{ steps.apt-week.outputs.week }}
          restore-keys: apt-ubuntu-26.04-

      - name: Install dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          apt_opts=(-o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true
                    -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get "${apt_opts[@]}" update -qq
          sudo apt-get "${apt_opts[@]}" install -y cmake ninja-build build-essential pkg-config libcurl4-openssl-dev \
            libsdl3-dev libopenal-dev zlib1g-dev libbz2-dev libstorm-dev qt6-base-dev libgl1-mesa-dev \
            clang-tidy
          sudo apt-get "${apt_opts[@]}" autoclean -qq
          sudo chown -R "$USER" ~/apt-archives

      # Keyed on FFmpeg's version and configure options only (the lines that
      # name build/ffmpeg-<key>), so other edits to that CMakeLists keep the
      # cache and a run doesn't fetch ffmpeg.org, which resets connections.
      - name: FFmpeg cache key
        id: ffmpeg-key
        shell: bash
        run: |
          key=$(sed -n -e '/^set(D2D_FFMPEG_VERSION /p' -e '/set(ffmpeg_options/,/enable-decoder=/p' \
            apps/d2d/CMakeLists.txt | git hash-object --stdin)
          echo "key=${key:0:16}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-*
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-key.outputs.key }}
          restore-keys: ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      # A cache miss leaves an ffmpeg_build target: build it for its headers.
      - name: Configure and generate
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          targets=(d2d-launcher_autogen)
          if ninja -C build -t targets all | grep -q '^ffmpeg_build:'; then targets+=(ffmpeg_build); fi
          cmake --build build --target "${targets[@]}"

      # Names say what they hold and files include what they use (docs/PLAN.md
      # "Code style"): .clang-tidy's identifier-length and include-cleaner
      # checks. A push to main sweeps everything (rot never lands); a PR
      # narrows to the changed .cpp / .hpp so review is a couple of minutes,
      # not ten. A header edit re-tidies every TU that includes it. The
      # changed files come from the PR API so no extra git fetch is needed
      # (`persist-credentials: false` above blocks git fetch anyway).
      - name: Names and includes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json; print('\n'.join(sorted({e['file'] for e in json.load(open('build/compile_commands.json')) if '/_deps/' not in e['file'] and '/build/' not in e['file']})))" > tidy_files.txt
          # A PR: its files; a push to main: the push's (a failed compare,
          # e.g. after a force push, or a tag tidies everything).
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(gh pr view "${{ github.event.pull_request.number }}" --json files --jq '.files[].path') || exit 1
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            changed=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" \
                --jq '.files[].filename') || changed=""
          fi
          # gh pr view lists 100 files at most, compare 300: a list that full
          # may be cut short, so tidy everything.
          if [ "$(grep -c . <<< "$changed")" -ge 100 ]; then changed=""; fi
          if [ -n "$changed" ]; then
            grep -E '\.(cpp|hpp)$' <<< "$changed" > changed.txt || true
            python3 tools/tidy-pr-select.py > tidy_files.txt
            if [ ! -s tidy_files.txt ]; then echo "Nothing to tidy" && exit 0; fi
            echo "Changed-files mode: $(wc -l < tidy_files.txt) files to tidy"
            cat tidy_files.txt
          fi
          xargs -P "$(nproc)" -n 1 clang-tidy -p build --quiet --extra-arg=-Wno-unknown-warning-option < tidy_files.txt

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: changes
    # main and tags only: the slowest jobs, and a pull request rarely breaks
    # only the Flatpak. One that does shows on main after the merge.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0   # every tag, for git describe's version stamp

      - name: Prepare clean Flatpak source tree
        run: |
          mkdir -p build/flatpak-source
          git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD | tar -x -C build/flatpak-source
          git -c safe.directory="$GITHUB_WORKSPACE" describe --tags --always > build/flatpak-source/VERSION   # the archive has no .git

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: .github/flatpak/ci-manifest.yml
          bundle: d2decomped-${{ matrix.arch }}.flatpak
          artifact-name: d2decomped-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          build-dir: flatpak_app-${{ matrix.arch }}
          keep-build-dirs: true
          # The action's default key is the manifest's hash: saved once, then
          # restored as-is, its ccache ever staler. A key per run (the action
          # appends the arch; restore takes the newest flatpak-builder-<arch>*)
          # keeps it current. Only main saves, as for ccache above: a PR's
          # copy (2.3 GB once) evicts main's.
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.run_id }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Flatpak Sentry debug information
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mindwerks
          SENTRY_PROJECT: d2d
        shell: bash
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN is not configured; Flatpak crash reports will lack symbolicated stack traces."
            exit 0
          fi
          build_dir="flatpak_app-${{ matrix.arch }}"
          d2d_binary=$(find "$build_dir" -type f -name d2d -print -quit)
          crashpad_handler=$(find "$build_dir" -type f -name crashpad_handler -print -quit)
          if [ -z "$d2d_binary" ] || [ -z "$crashpad_handler" ]; then
            echo "::error::Could not find both d2d and crashpad_handler in the Flatpak build directory."
            exit 1
          fi
          npx --yes @sentry/cli@3.8.0 debug-files upload --include-sources --wait-for 60 \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            "$d2d_binary" "$crashpad_handler"

  # d2d alone for D2Vita (docs/d2vita.md): a Win32 Game.exe (MinGW) and a
  # PS Vita VPK (VitaSDK); and a Switch NRO (devkitA64, docs/switch.md).
  # Each built by tools/porter.sh in its container.
  # ponytail: no ccache or FFmpeg cache; add them if these become the slow jobs.
  ports:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ${{ matrix.image }}
    env:
      SDL3_VERSION: "3.4.16"     # as the Windows build's
      OPENAL_VERSION: "1.25.2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32
            name: D2Vita (Win32)
            artifact: d2vita-win32
            image: ubuntu:26.04
          - target: vita
            name: D2Vita (PS Vita)
            artifact: d2vita-vita
            # A digest: :latest moves with every VitaSDK package update.
            image: vitasdk/vitasdk@sha256:f0eeb443be707be534c568d5d23702e14152a8513778cd11d209aa1b42fbd434
          - target: switch
            name: Nintendo Switch
            artifact: switch
            image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      # Before the checkout: without git it downloads a tarball, and
      # git describe has no tags to stamp the version from.
      - name: Install dependencies (Win32)
        if: matrix.target == 'win32'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates cmake ninja-build make gcc libc6-dev \
            git curl unzip g++-mingw-w64-i686-posix libz-mingw-w64-dev

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0   # every tag, for git describe's version stamp

      # The container's root doesn't own the checkout: git refuses it
      # (CMake's version stamp would read "unknown").
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download SDL3 and OpenAL Soft (Win32)
        if: matrix.target == 'win32'
        run: |
          mkdir -p deps
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-devel-$SDL3_VERSION-mingw.tar.gz" | tar -xz -C deps
          curl -fsSLo deps/openal.zip "https://github.com/kcat/openal-soft/releases/download/$OPENAL_VERSION/openal-soft-$OPENAL_VERSION-bin.zip"
          unzip -q deps/openal.zip -d deps
          echo "SDL3_MINGW=$PWD/deps/SDL3-$SDL3_VERSION" >> "$GITHUB_ENV"
          echo "OPENAL_MINGW=$PWD/deps/openal-soft-$OPENAL_VERSION-bin" >> "$GITHUB_ENV"

      - name: Build
        run: tools/porter.sh ${{ matrix.target }}

      - name: Zip
        run: |
          zip="$PWD/build/d2d-$(git describe --tags --always)-${{ matrix.artifact }}.zip"
          cd build/ports/${{ matrix.target }} && cmake -E tar cf "$zip" --format=zip -- *

      # Pull requests too, unlike the packages: a few MB, and a pull
      # request's is the only one to try on a Vita or Switch before the merge.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}
          path: build/d2d-*-${{ matrix.artifact }}.zip
          if-no-files-found: error

  # The one check the main ruleset requires: green when every job above
  # passed or was skipped for a docs-only change.
  ci-ok:
    name: CI ok
    needs: [changes, build, tidy, flatpak, ports]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - ports
      - flatpak
      - tidy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" \
              --title "D2: Decomped - $TAG" --generate-notes
          fi
          gh release upload "$TAG" --repo "$REPOSITORY" \
            release-assets/* --clobber
