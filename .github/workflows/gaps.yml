# The gap map (tools/gaps.py) on GitHub Pages: rebuilt on every push to main.
name: Gap map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history, for the credits

      - name: Build the gap map
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/gaps.py --issues --history --out site

      - name: Add the landing page
        run: |
          cp tools/site/index.html assets/icon/hero.png assets/icon/d2d.png site/
          cp docs/screenshots/widescreen-act1.png site/screenshot.png

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
