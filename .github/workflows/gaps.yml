# SPDX-License-Identifier: GPL-3.0-or-later
# The gap map (tools/gaps.py) on GitHub Pages: rebuilt on every push to main.
name: Gap map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history, for the credits

      - name: Build the gap map
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/gaps.py --issues --history --out site

      # Posts to Discord when "% done" (the page's number, to one decimal) goes up.
      # Compares against the gaps.json still live on Pages; skipped with no secret set.
      - name: Announce progress on Discord
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          python3 - <<'EOF'
          import json, os, urllib.request
          def done(summary):
              t = summary["totals"]
              levels = ("untouched", "cited", "oracle", "ported", "verified")
              return round(100 * (t["verified"]["bytes"] + t["ported"]["bytes"]) / sum(t[s]["bytes"] for s in levels), 1)
          try:
              with urllib.request.urlopen("https://psi29a.github.io/d2decomped/gaps.json", timeout=30) as r:
                  old = done(json.load(r))
          except Exception as error:
              print(f"no live gaps.json to compare: {error}"); raise SystemExit
          new_summary = json.load(open("site/gaps.json"))
          new = done(new_summary)
          print(f"done: {old}% -> {new}%")
          if new <= old:
              raise SystemExit
          commit = new_summary["generated"]["commit"]
          url = "https://psi29a.github.io/d2decomped/gaps.html"
          messages = [
              f"🔥⛧🔥 **More of the Prime Evil's code is ours** 🔥⛧🔥\n"
              f"😈 D2Decomp is now **{new}% done** (was {old}%), as of `{commit}`\n💀 The gap map: {url}",
              f"⛧ **Another shard of the Soulstone is ours** ⛧\n"
              f"🔥 **{new}%** decompiled (was {old}%) · `{commit}`\n🕯️ {url}",
              f"🔥 **We descend deeper into Hell** 🔥\n⛧ {old}% → **{new}%** done · `{commit}`\n💀 See how deep: {url}",
              f"🕯️⛧🕯️ **The ritual grows stronger** 🕯️⛧🕯️\n"
              f"🩸 **{new}%** of game.exe reclaimed (was {old}%)\n🔥 `{commit}` · {url}",
          ]
          # ponytail: rotates by tenths of a percent, so a jump of exactly 0.4 repeats one; store the last pick if that bothers anyone
          body = {"content": messages[round(new * 10) % len(messages)]}
          request = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], json.dumps(body).encode(),
                                           {"Content-Type": "application/json", "User-Agent": "d2decomped-gaps"})
          urllib.request.urlopen(request, timeout=30)
          EOF

      - name: Add the landing page
        run: |
          cp tools/site/index.html assets/icon/hero.png assets/icon/d2d.png site/
          cp docs/screenshots/widescreen-act1.png site/screenshot.png

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
