name: Coverity Scan

on:
  # A merged PR updates main, so this also scans every PR merge.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverity:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libcurl4-openssl-dev \
            libsdl3-dev libopenal-dev zlib1g-dev libbz2-dev libstorm-dev qt6-base-dev libgl1-mesa-dev

      - name: Download Coverity Build Tool
        run: |
          : "${COVERITY_TOKEN:?Set the COVERITY_SCAN_TOKEN repository secret}"
          curl -sS -L --fail \
            --form token="$COVERITY_TOKEN" \
            --form project="psi29a/d2decomped" \
            -o cov-analysis-linux64.tar.gz \
            https://scan.coverity.com/download/linux64
          mkdir cov-analysis
          tar xzf cov-analysis-linux64.tar.gz --strip-components=1 -C cov-analysis
          echo "$PWD/cov-analysis/bin" >> "$GITHUB_PATH"
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}

      # C++23: Coverity 2024.12 doesn't know -std=c++26 and parses it as C++17,
      # so the C++20 parts of libstdc++ fail and 84 of our files dropped out of
      # the scan (2026-10-18). Everything of ours builds as C++23.
      # Header checks off: 55 one-#include TUs re-emit headers the real .cpps
      # already cover, and only grow the tarball (470M, near the upload limit).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_STANDARD=23 -DD2D_CHECK_HEADERS=OFF

      # Sentry/Crashpad is ~300 of the ~430 TUs; captured, the tarball hit 545M
      # and scan.coverity.com refused it (413). Built first, cov-build skips it.
      - name: Build FFmpeg and Sentry (not scanned)
        run: cmake --build build --config RelWithDebInfo --target ffmpeg_build sentry crashpad_handler

      - name: Build with cov-build
        run: cov-build --dir cov-int cmake --build build --config RelWithDebInfo -- -k 0

      # Which translation units Coverity couldn't capture, and why.
      - name: Keep Coverity's build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverity-build-log
          path: cov-int/build-log.txt
          retention-days: 14

      # A manual run on a branch only builds and keeps the log above: no upload,
      # so it spends none of Coverity Scan's weekly builds and leaves main's results.
      - name: Package results
        if: github.ref == 'refs/heads/main'
        run: tar czf d2decomped.tgz cov-int

      # The direct form upload (POST /builds, file=@...) caps out near 500M and
      # returned 413 at 712M (2026-10-31). Like OpenMW's --form url=, this hands
      # Coverity the file out of band: init gives a presigned storage URL, we PUT
      # the tarball there, then enqueue the build.
      - name: Upload to Coverity Scan
        if: github.ref == 'refs/heads/main'
        run: |
          ls -lh d2decomped.tgz
          api="https://scan.coverity.com/projects/psi29a%2Fd2decomped/builds"
          curl -sS --fail -o init.json \
            --form token="$COVERITY_TOKEN" \
            --form email="psi29a@gmail.com" \
            --form file_name="d2decomped.tgz" \
            --form version="$GITHUB_SHA" \
            --form description="main build" \
            "$api/init"
          upload_url=$(jq -r '.url' init.json)
          build_id=$(jq -r '.build_id' init.json)
          curl -sS --fail -X PUT \
            --header "Content-Type: application/json" \
            --upload-file d2decomped.tgz \
            "$upload_url"
          curl -sS --fail -X PUT \
            --form token="$COVERITY_TOKEN" \
            "$api/$build_id/enqueue"
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
