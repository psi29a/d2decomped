      - type: archive
        url: https://github.com/ladislav-zezula/StormLib/archive/refs/tags/v9.30.tar.gz
        sha256: a709a6b034d206404f5297d85e474371203ff5483639955195d99b737bbf7dfe
        dest: project/third_party/stormlib
      - type: archive
